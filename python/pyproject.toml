[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mq-bridge-meilisearch"
version = "0.1.0"
description = "Meilisearch endpoint for mq-bridge"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.8"
keywords = ["messaging", "meilisearch", "search", "mq-bridge", "etl", "cdc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: System :: Networking",
]
# Deliberately no dependency on mq-bridge: the two are installed and upgraded
# independently, and `register()` reports a clear error if mq-bridge is absent.
dependencies = []

[project.urls]
Repository = "https://github.com/marcomq/mq-bridge-meilisearch"

[tool.setuptools]
# The wheel carries a prebuilt library, so it is platform-specific;
# mq_bridge.plugin_packaging stages the library and applies the platform tag.
packages = ["mq_bridge_meilisearch"]

[tool.setuptools.package-data]
mq_bridge_meilisearch = ["*.so", "*.dylib", "*.dll", "mq-bridge-plugin.json"]
