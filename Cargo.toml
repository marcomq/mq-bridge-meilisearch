[package]
name = "mq-bridge-meilisearch"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Meilisearch endpoint extension for mq-bridge"
repository = "https://github.com/marcomq/mq-bridge-meilisearch"
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/Cargo.toml",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
# `rlib` for Rust users who link the endpoint directly; `cdylib` is the loadable
# plugin the Python and npm packages ship and `load_endpoint_plugin` opens.
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
mq-bridge = { version = "0.4.13", default-features = false }
# Meilisearch's REST API directly, rather than the `meilisearch-sdk` crate: that
# crate models documents as a typed `T`, which cannot round-trip the arbitrary
# JSON a bridge carries, and it hides the HTTP status this endpoint classifies
# retryable and permanent failures from.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "query", "gzip"] }
# Derives the configuration schema from the struct below, so the two cannot
# drift and the doc comments become the field descriptions a host's form shows.
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.34", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"

[dev-dependencies]
mq-bridge = { version = "0.4.13", default-features = false, features = ["plugin-sdk", "test-utils"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }

[[example]]
name = "file_to_meilisearch"
required-features = ["example-app"]

[features]
# The plugin export is on by default: it is what the Python and npm packages
# load. Turn it off (`default-features = false`) when linking this crate
# directly alongside another plugin, since both would define the same
# `mq_bridge_plugin_v1` symbol.
default = ["plugin"]
plugin = ["mq-bridge/plugin-sdk"]
example-app = []
