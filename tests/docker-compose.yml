services:
  meilisearch:
    image: getmeili/meilisearch:v1.53
    environment:
      MEILI_MASTER_KEY: "mq-bridge-test-key"
      MEILI_ENV: "development"
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 2s
      timeout: 5s
      retries: 30
