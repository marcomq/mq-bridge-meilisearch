name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # The Docker-backed tests are `#[ignore]`d because they need a Meilisearch
  # instance. Docker and the compose plugin are preinstalled on ubuntu runners,
  # so the job just has to ask for the ignored tests explicitly.
  plugin-conformance:
    name: Endpoint tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify package versions
        run: python3 scripts/set_version.py --check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Verify Docker is available
        run: docker compose version

      - name: Unit tests
        run: cargo test --lib

      - name: Meilisearch integration tests
        run: cargo test --test integration -- --ignored --nocapture

      - name: Endpoint behaviour, linked and plugin-loaded
        run: cargo test --test plugin -- --ignored --nocapture

  node-package:
    name: Node package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: node
        run: npm install --no-package-lock

      - name: Run tests
        working-directory: node
        run: npm test
